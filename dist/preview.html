<script>const icons={heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',hospital:'<path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M2 21h20M9 21v-4h6v4M12 6v6M9 9h6"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-4-5"/>',chevron:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m14 6-6 6 6 6M8 12h13"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/>',drop:'<path d="M12 2S4 11 4 16a8 8 0 0 0 16 0c0-5-8-14-8-14Z"/>'};
const svg=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.heart}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const centers=[{id:1,name:'Red Oak Blood Center',area:'Indiranagar',city:'Bengaluru',hours:'9:00 AM – 6:00 PM',address:'12, Oak Avenue, Indiranagar'},{id:2,name:'Hope Community Blood Center',area:'Jayanagar',city:'Bengaluru',hours:'8:00 AM – 7:00 PM',address:'45, Community Road, Jayanagar'},{id:3,name:'LifeSpring Blood Center',area:'Whitefield',city:'Bengaluru',hours:'9:00 AM – 5:00 PM',address:'8, Spring Lane, Whitefield'},{id:4,name:'Unity Blood Center',area:'Koramangala',city:'Bengaluru',hours:'8:30 AM – 6:00 PM',address:'24, Unity Street, Koramangala'},{id:5,name:'CareBridge Blood Center',area:'Rajajinagar',city:'Bengaluru',hours:'9:00 AM – 7:00 PM',address:'16, Bridge Road, Rajajinagar'},{id:6,name:'New Dawn Blood Center',area:'Kengeri',city:'Bengaluru',hours:'9:00 AM – 6:00 PM',address:'32, Dawn Avenue, Kengeri'}];
const names=['Aarav Mehta','Ananya Rao','Rohan Shah','Meera Nair','Kabir Menon'];
const bloodGroups=['A+','A−','B+','B−','AB+','AB−','O+','O−'];
let criteria=null,selectedDonor=null,application=null,approvalTimer=null;
const main=document.querySelector('main'),dialog=document.querySelector('dialog');
const back=(route,label='Back')=>`<a class="back" href="#${route}">${svg('back')}${label}</a>`;
function popup(title,body,button='Continue'){document.querySelector('#dialog-content').innerHTML=`<div class="status-mark">${svg('check')}</div><h2 id="dialog-title">${title}</h2><p>${body}</p>`;document.querySelector('#dialog-close').textContent=button;dialog.showModal()}
document.querySelector('#dialog-close').addEventListener('click',()=>dialog.close());
function home(){main.innerHTML=`<section class="home"><div class="home-copy"><h1>A little of you.<br>A lot of <em>life.</em></h1><p>Giving blood starts with a connection. Find a blood center, or help your hospital find the right donor.</p><div class="human-note">${svg('heart')}<span>One connection can make a difference.</span></div></div><div class="portal-panel"><h2>Every connection starts here.</h2><p>Choose how you’d like to be part of it.</p><button class="role-card" data-go="donor"><span class="role-icon">${svg('heart')}</span><span><strong>I’m a donor</strong><small>Find a blood center. Take the first step.</small></span>${svg('chevron','enter')}</button><button class="role-card" data-go="hospital"><span class="role-icon">${svg('hospital')}</span><span><strong>I’m a Hospital Admin</strong><small>Find donors for the people in your care.</small></span>${svg('chevron','enter')}</button><div class="panel-note">${svg('shield')}<span>No sign-up needed. Explore with sample data.</span></div></div></section><section class="connection" aria-label="About this demo"><div>${svg('pin')}<span><strong>A center near you</strong><p>Explore six sample blood centers in Bengaluru.</p></span></div><div>${svg('people')}<span><strong>A simpler way to connect</strong><p>Clear steps, from discovery to request.</p></span></div><div>${svg('heart')}<span><strong>People at the heart of it</strong><p>Built around donors and the people in their care.</p></span></div></section>`}
function donor(){main.innerHTML=`<div class="page">${back('home','Choose a different role')}<div class="heading-row"><div><h1>Small step. Meaningful difference.</h1><p class="subtitle">Choose a blood center to begin your donor application.</p></div><span class="step">Choose center · Apply · Your profile</span></div><div class="toolbar"><div class="search">${svg('search')}<input id="center-search" type="search" placeholder="Search by center or neighborhood" aria-label="Search blood centers"></div><span id="center-count" class="count"></span></div><div id="center-list" class="cards"></div></div>`;drawCenters('');document.querySelector('#center-search').addEventListener('input',e=>drawCenters(e.target.value))}
function drawCenters(query){const list=centers.filter(c=>`${c.name} ${c.area} ${c.city}`.toLowerCase().includes(query.toLowerCase().trim()));document.querySelector('#center-count').textContent=`${list.length} sample ${list.length===1?'center':'centers'} · Bengaluru`;document.querySelector('#center-list').innerHTML=list.length?list.map(c=>`<article class="center-card"><div class="center-top"><span class="center-symbol">${svg('hospital')}</span><span class="tag neutral">Sample center</span></div><h2>${c.name}</h2><p class="meta">${svg('pin')}${c.area}, ${c.city}</p><p class="meta">${svg('clock')}${c.hours}</p><p class="card-desc">Explore the donor journey with this sample center.</p><button class="primary full" data-apply="${c.id}">Apply as a donor</button></article>`).join(''):`<div class="empty"><h2>No centers found</h2><p>Try a different center name or neighborhood.</p><button class="secondary" data-clear-search>Clear search</button></div>`}
function apply(id){if(application&&application.center.id===id){location.hash='application';return}application={center:centers.find(c=>c.id===id),sentAt:Date.now(),approved:false,celebrated:false};location.hash='application'}
function applicationPage(){if(!application){location.replace('#donor');return}const a=application;const remaining=Math.max(0,5000-(Date.now()-a.sentAt));if(remaining===0)a.approved=true;main.innerHTML=`<div class="page">${back('donor','Back to blood centers')}<div class="application"><section class="status-panel ${a.approved?'approved':''}" aria-live="polite"><div class="status-mark">${svg(a.approved?'check':'send')}</div><h1>${a.approved?'You’re part of something good.':'Application sent.'}</h1><p>${a.approved?'Your sample application has been approved.':`Your request has been sent to ${a.center.name}.`}</p><div class="timeline"><span class="active">Sent</span><span class="line"></span><span class="${a.approved?'active':''}">${a.approved?'Approved':'Approval pending'}</span></div><p>${a.approved?`Thank you for taking the first step with ${a.center.name}.`:'<span class="spinner"></span>Demo approval appears after 5 seconds.'}</p></section>${a.approved?profileMarkup({name:'Alex Morgan',blood:'O+',center:a.center,city:a.center.city,age:27,id:'LL-DEMO-001'},true):''}</div></div>`;if(a.approved&&!a.celebrated){a.celebrated=true;popup('A little kindness. A big thank you.','Congratulations! Your sample donor application is approved. Thank you for choosing to make a difference. Your placeholder blood profile is ready.','View my profile')}if(remaining>0)approvalTimer=setTimeout(()=>{a.approved=true;if(location.hash==='#application')applicationPage()},remaining)}
function hospital(){main.innerHTML=`<div class="page">${back('home','Choose a different role')}<div class="form-layout"><aside class="form-aside"><h1 class="page-title">The right connection.<br>When it matters.</h1><p>Tell us what your hospital needs. We’ll find matching sample donors across different blood centers.</p><div class="aside-note">${svg('shield')}<span>This is a demonstration. Donor availability and request confirmations are simulated.</span></div></aside><form id="hospital-form"><div class="form-grid"><div class="field span"><label for="hospital-name">Hospital name</label><input id="hospital-name" name="hospital" placeholder="e.g. Greenfield Hospital" required maxlength="80" autocomplete="organization"></div><div class="field"><label for="city">City</label><select id="city" name="city"><option>Bengaluru</option><option>Mumbai</option><option>New Delhi</option></select></div><div class="field"><label for="blood">Blood group</label><select id="blood" name="blood">${bloodGroups.map(b=>`<option${b==='O+'?' selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label for="component">Blood component</label><select id="component" name="component"><option>Whole blood</option><option>Packed red cells</option><option>Platelets</option><option>Plasma</option></select></div><div class="field"><label for="units">Units required</label><input id="units" name="units" type="number" value="1" min="1" max="10" step="1" required></div><div class="field span"><label for="urgency">Required within</label><select id="urgency" name="urgency"><option>24 hours</option><option>48 hours</option><option>7 days</option></select></div></div><button class="primary full" type="submit">Find matching donors</button><p class="form-note">Searches sample records. No patient information needed.</p></form></div></div>`;if(criteria){for(const [key,value]of Object.entries(criteria)){const field=document.querySelector(`[name="${key}"]`);if(field)field.value=value}}document.querySelector('#hospital-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);criteria=Object.fromEntries(data);criteria.hospital=criteria.hospital.trim();if(!criteria.hospital){document.querySelector('#hospital-name').setCustomValidity('Enter your hospital name.');document.querySelector('#hospital-name').reportValidity();return}location.hash='matches'});document.querySelector('#hospital-name').addEventListener('input',e=>e.target.setCustomValidity(''))}
function records(){return ['Bengaluru','Mumbai','New Delhi'].flatMap(city=>bloodGroups.flatMap((blood,b)=>names.map((name,i)=>({id:`LL-${city.slice(0,2).toUpperCase()}-${b}${i}`,name,blood,age:24+i*3,city,center:{...centers[i],city,area:city==='Bengaluru'?centers[i].area:['Central District','East District','West District','South District','North District'][i],address:city==='Bengaluru'?centers[i].address:`${12+i*8}, Community Road`},components:['Whole blood','Packed red cells','Platelets','Plasma'],availableWithin:24,availableUnits:i===4?4:3}))))}
function matchingRecords(){if(!criteria)return[];const hours={'24 hours':24,'48 hours':48,'7 days':168}[criteria.urgency];return records().filter(d=>d.blood===criteria.blood&&d.city===criteria.city&&d.components.includes(criteria.component)&&d.availableWithin<=hours&&d.availableUnits>=Number(criteria.units)).slice(0,5)}
function matches(){if(!criteria){location.replace('#hospital');return}const list=matchingRecords();main.innerHTML=`<div class="page">${back('hospital','Edit hospital requirements')}<div class="heading-row"><div><h1>${list.length?'A connection worth making.':'Let’s adjust your search.'}</h1><p class="subtitle">${list.length?`${list.length} matching sample profiles for ${esc(criteria.hospital)}. Select a donor to see their profile.`:'No sample center can fulfill this request with the selected number of units.'}</p></div><span class="count">${list.length} ${list.length===1?'match':'matches'}</span></div><div class="filter-summary">${[criteria.blood,criteria.city,criteria.component,`${criteria.units} ${Number(criteria.units)===1?'unit':'units'}`,`Within ${criteria.urgency}`].map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="cards">${list.length?list.map(d=>`<article class="center-card donor-card"><div class="center-top"><div class="avatar">${d.name.split(' ').map(n=>n[0]).join('')}</div><span class="blood-small">${d.blood}</span></div><h2>${d.name}</h2><p class="meta">${svg('hospital')}${d.center.name}</p><p class="meta">${svg('pin')}${d.center.area}, ${d.city}</p><p class="card-desc">Sample availability · up to ${d.availableUnits} units at center<br>Required component: ${esc(criteria.component)}</p><button class="secondary full" data-profile="${d.id}">View blood profile</button></article>`).join(''):`<div class="empty"><h2>No matching sample profiles</h2><p>The demo centers have up to 4 units available. Try a lower quantity.</p><a class="primary" href="#hospital">Edit requirements</a></div>`}</div><p class="profile-note">These are fictional profiles with illustrative availability. Matching uses the exact requested group and component; clinical compatibility must be determined by a qualified blood center.</p></div>`}
function profileMarkup(d,own=false){return `<section class="profile" aria-label="${own?'Your placeholder blood profile':'Sample donor blood profile'}"><div class="profile-head"><div class="avatar">${d.name.split(' ').map(n=>n[0]).join('')}</div><div><h2>${d.name}</h2><p>Placeholder blood profile</p></div><div class="blood" aria-label="Blood group ${d.blood}">${d.blood}</div></div><dl class="details"><div><dt>Donor ID</dt><dd>${d.id}</dd></div><div><dt>Age</dt><dd>${d.age} years</dd></div><div><dt>Blood center</dt><dd>${d.center.name}</dd></div><div><dt>Location</dt><dd>${d.center.area}, ${d.city}</dd></div><div><dt>Blood group</dt><dd>${d.blood}</dd></div><div><dt>Profile status</dt><dd>${own?'Demo approved':'Sample record'}</dd></div></dl>${own?'':`<div class="contact-block"><h3>Contact through the blood center</h3><dl class="details"><div><dt>Contact point</dt><dd>Donor coordination desk</dd></div><div><dt>Visiting hours</dt><dd>${d.center.hours}</dd></div><div><dt>Sample address</dt><dd>${d.center.address}, ${d.city}</dd></div><div><dt>Request recipient</dt><dd>${d.center.name}</dd></div></dl></div>`}<p class="profile-note">Fictional profile for demonstration. ${own?'This approval does not establish medical eligibility to donate.':'Availability and quantities are illustrative center records, not a commitment by this donor.'}</p>${own?'':`<div class="profile-actions"><div class="request-summary">${esc(criteria.component)} · ${esc(criteria.units)} ${Number(criteria.units)===1?'unit':'units'} · Within ${esc(criteria.urgency)}</div><p>Send a simulated request from ${esc(criteria.hospital)} to the center’s coordination desk.</p><button class="primary full" id="send-request">Send Request</button></div>`}</section>`}
function donorProfile(){if(!criteria||!selectedDonor){location.replace(criteria?'#matches':'#hospital');return}main.innerHTML=`<div class="page">${back('matches','Back to matching donors')}<div class="application"><h1 class="page-title">Meet your potential connection.</h1><p class="subtitle">Review the sample blood profile and center contact details.</p>${profileMarkup(selectedDonor)}</div></div>`;document.querySelector('#send-request').addEventListener('click',e=>{e.target.disabled=true;e.target.textContent='Request sent';popup('Request sent. Connection started.',`Your demo request for ${esc(criteria.units)} ${Number(criteria.units)===1?'unit':'units'} of ${esc(criteria.component.toLowerCase())} has been recorded for ${esc(selectedDonor.center.name)}. No real message has been sent.`,'Back to profile')})}
function how(){main.innerHTML=`<div class="page how">${back('home','Back to home')}<h1 class="page-title">A simple path to connection.</h1><h2>For donors</h2><ol><li>Explore the six sample blood centers in Bengaluru.</li><li>Choose a center and apply. The request shows as sent.</li><li>After five seconds, the demo approves your application and creates a placeholder blood profile.</li></ol><h2>For hospital administrators</h2><ol><li>Enter your hospital name, city, blood group, component, quantity, and timeframe.</li><li>Browse matching fictional donors from different sample centers.</li><li>Open a blood profile, review the center details, and send a simulated request.</li></ol><p class="profile-note">This website is an interactive prototype. It does not verify donor eligibility, coordinate real donations, provide live inventory, or send external requests.</p><a class="primary" href="#home">Choose your role</a></div>`}
function route(){clearTimeout(approvalTimer);if(dialog.open)dialog.close();const name=location.hash.slice(1)||'home';({home,donor,hospital,application:applicationPage,matches,profile:donorProfile,how}[name]||home)();main.focus({preventScroll:true});window.scrollTo(0,0)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)location.hash=go.dataset.go;const applyButton=e.target.closest('[data-apply]');if(applyButton)apply(Number(applyButton.dataset.apply));const profileButton=e.target.closest('[data-profile]');if(profileButton){selectedDonor=matchingRecords().find(d=>d.id===profileButton.dataset.profile);location.hash='profile'}if(e.target.closest('[data-clear-search]')){document.querySelector('#center-search').value='';drawCenters('');document.querySelector('#center-search').focus()}});
window.addEventListener('hashchange',route);route();
</script></body>
</html>
